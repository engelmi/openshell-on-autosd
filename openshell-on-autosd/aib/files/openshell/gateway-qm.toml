[openshell]
version = 1

[openshell.gateway]
compute_drivers = ["podman"]
default_image = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:0.0.65"
disable_tls = true

[openshell.gateway.auth]
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
signing_key_path = "/etc/openshell/state/tls/jwt/signing.pem"
public_key_path = "/etc//openshell/state/tls/jwt/public.pem"
kid_path = "/etc/openshell/state/tls/jwt/kid"
gateway_id = "local-gateway"
ttl_secs = 0  # 0 = no expiry for local dev

[openshell.drivers.podman]
socket_path = "/run/podman/podman.sock"
image_pull_policy = "missing"
network_name = "openshell"
stop_timeout_secs = 10

[openshell.drivers.vm]
state_dir = "/var/lib/openshell/vm-driver"
driver_dir = "/usr/libexec/openshell"
grpc_endpoint = "https://127.0.0.1:8080"
