[Service]
Environment=HOME=/root
Environment=XDG_CONFIG_HOME=/root/.config
Environment=XDG_STATE_HOME=/root/.local/state
Environment=OPENSHELL_PODMAN_SOCKET=%t/podman/podman.sock

# Use empty ExecStartPre to reset previous ExecStartPre= commands
ExecStartPre=
ExecStartPre=/usr/libexec/openshell/init-pki.sh /root/.local/state/openshell/tls
ExecStartPre=/usr/libexec/openshell/init-gateway-env.sh /root/.config/openshell/gateway.env
EnvironmentFile=-/root/.config/openshell/gateway.env
